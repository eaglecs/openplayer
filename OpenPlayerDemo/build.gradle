plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace "com.audio.now.digital.openplayerdemo"
    compileSdk 36

    defaultConfig {
        applicationId "com.audio.now.digital.openplayerdemo"
        minSdk 21
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            storeFile file("omni_demo.jks")
            storePassword "123456a@A"
            keyAlias "omni_demo"
            keyPassword "123456a@A"
        }
    }

    buildTypes {
        debug {
            // cấu hình nếu cần
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation "com.squareup.retrofit2:retrofit:2.3.0"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.3.0"
    implementation "com.squareup.retrofit2:converter-gson:2.3.0"
    implementation "com.squareup.okhttp3:okhttp:4.10.0"

    implementation "io.reactivex.rxjava2:rxkotlin:2.4.0"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.0"
    implementation "io.reactivex.rxjava2:rxjava:2.2.10"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"

    implementation "com.github.eaglecs:openplayer:2.1.16"
}
